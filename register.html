<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar | Monitoring IoT</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="img/logo.png" alt="Logo" />
        <h1>Daftar Akun Baru</h1>
        <p>Buat akun untuk mengakses dashboard monitoring Anda</p>
      </div>

      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="nama@email.com" required />
        </div>
        <div class="form-group password-group">
          <label for="registerPassword">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="registerPassword" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggleRegisterPassword" aria-label="Tampilkan password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group password-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Tampilkan password konfirmasi">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Daftar</button>
        <p id="registerMessage" class="form-message"></p>
        <p class="form-footer">Sudah punya akun? <a href="login.html" class="link">Masuk di sini</a></p>
      </form>
    </div>

    <div class="login-art">
      <div class="art-content">
        <h2>Mulai Pantau <br/>Perangkat Anda</h2>
        <p>Daftar sekarang untuk melihat data sensor secara realtime dengan tampilan yang elegan dan responsif.</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
